# dsh-agent-board bundle patch: inserts its plugin row into the web
# plugin roster. The single row mounts BOTH halves: the host side (stall
# detector + /api/agent-board/agents route) and the browser side (the
# sidebar footer action + floating panel, served from lib/client.js).
- insert:
    - id: agent-board
      name: '@dsh-external/dsh-agent-board'
